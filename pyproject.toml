[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pathcue"
version = "0.2.0"
description = "PathCue: a context-aware, knowledge-augmented urban travel assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aris Xu", email = "acexbr@outlook.com"}]
dependencies = []

[project.optional-dependencies]
documents = ["python-docx>=1.1", "pypdf>=5.0", "reportlab>=4.0"]
embeddings = ["model2vec>=0.9"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "langgraph>=1.0", "tzdata>=2025.1"]
agent = ["langgraph>=1.0", "mcp[cli]>=1.0"]
milvus = ["pymilvus>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.9", "httpx>=0.28"]
all = [
  "python-docx>=1.1", "pypdf>=5.0", "reportlab>=4.0", "model2vec>=0.9",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8",
  "langgraph>=1.0", "mcp[cli]>=1.0", "pymilvus>=2.5",
  "tzdata>=2025.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
